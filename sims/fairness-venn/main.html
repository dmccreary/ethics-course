<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Consensus: Champions of Fairness</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #a0a0a0;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.95rem;
        }
        #chart-container {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .ellipse {
            fill-opacity: 0.15;
            stroke-width: 2;
            cursor: pointer;
            transition: fill-opacity 0.3s;
        }
        .ellipse:hover {
            fill-opacity: 0.25;
        }
        .ellipse-label {
            font-size: 16px;
            font-weight: 600;
            fill: #fff;
            pointer-events: none;
        }
        .person-dot {
            cursor: pointer;
            transition: r 0.2s, filter 0.2s;
        }
        .person-dot:hover {
            filter: brightness(1.3) drop-shadow(0 0 8px currentColor);
        }
        .person-label {
            font-size: 11px;
            fill: #fff;
            pointer-events: none;
            text-anchor: middle;
        }
        .tooltip {
            position: absolute;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px 16px;
            max-width: 320px;
            font-size: 13px;
            line-height: 1.5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .tooltip h3 {
            margin-bottom: 6px;
            color: #fff;
            font-size: 14px;
        }
        .tooltip .sources {
            color: #8be9fd;
            font-size: 11px;
            margin-top: 8px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        .stats {
            margin-top: 15px;
            text-align: center;
            color: #a0a0a0;
            font-size: 12px;
        }
        /* Edit mode styles */
        .edit-mode .person-dot {
            cursor: grab;
        }
        .edit-mode .person-dot:active {
            cursor: grabbing;
        }
        .edit-mode .person-dot.dragging {
            filter: brightness(1.5) drop-shadow(0 0 12px currentColor);
        }
        .edit-controls {
            display: none;
            margin-top: 15px;
            gap: 10px;
            align-items: center;
        }
        .edit-controls.visible {
            display: flex;
        }
        .edit-banner {
            display: none;
            background: #ff6b6b;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .edit-banner.visible {
            display: block;
        }
        .btn {
            background: #4ecdc4;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #3dbdb5;
        }
        .btn-secondary {
            background: #a78bfa;
        }
        .btn-secondary:hover {
            background: #9171e8;
        }
        .coords-display {
            font-family: monospace;
            font-size: 12px;
            color: #8be9fd;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 4px;
        }
        .dataset-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .dataset-selector label {
            font-weight: 500;
            color: #a0a0a0;
        }
        .dataset-selector select {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .dataset-selector select:hover {
            border-color: rgba(255,255,255,0.4);
        }
        .dataset-selector select:focus {
            outline: none;
            border-color: #4ecdc4;
        }
    </style>
</head>
<body>
    <div id="edit-banner" class="edit-banner">EDIT MODE - Drag dots to reposition, then click Save</div>

    <h1 id="main-title">AI Model Consensus: Champions of Fairness</h1>
    <p id="subtitle" class="subtitle">Comparing which historical figures four AI models identified as working toward a fairer world</p>

    <div class="dataset-selector">
        <label for="dataset-select">Dataset:</label>
        <select id="dataset-select">
            <option value="data.json">Champions of Fairness</option>
            <option value="unfair.json">Architects of Unfairness</option>
        </select>
    </div>

    <div id="edit-controls" class="edit-controls">
        <button id="save-btn" class="btn">Save Positions</button>
        <button id="reset-btn" class="btn btn-secondary">Reset to Default</button>
        <span id="coords-display" class="coords-display"></span>
    </div>

    <div id="chart-container">
        <svg id="venn"></svg>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background: #ff6b6b;"></div> Claude</div>
        <div class="legend-item"><div class="legend-color" style="background: #4ecdc4;"></div> OpenAI</div>
        <div class="legend-item"><div class="legend-color" style="background: #ffe66d;"></div> Grok</div>
        <div class="legend-item"><div class="legend-color" style="background: #a78bfa;"></div> DeepSeek</div>
    </div>

    <div class="stats">
        <strong>3 people</strong> mentioned by all 4 models | <strong>21 unique people</strong> total
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="venn.js"></script>
</body>
</html>
