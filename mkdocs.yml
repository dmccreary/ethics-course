      - Quiz: chapters/03-data-gathering/quiz.md
    - Ch 4. Impact Analysis:
      - Content: chapters/04-impact-analysis/index.md
      - Quiz: chapters/04-impact-analysis/quiz.md
    - Ch 5. Systems Thinking:
      - Content: chapters/05-systems-thinking/index.md
      - Quiz: chapters/05-systems-thinking/quiz.md
    - Ch 6. Looking for Leverage:
      - Content: chapters/06-looking-for-leverage/index.md
      - Quiz: chapters/06-looking-for-leverage/quiz.md
    - Ch 7. Advocating for Change:
      - Content: chapters/07-advocating-for-change/index.md
      - Quiz: chapters/07-advocating-for-change/quiz.md
    - Ch 8. Capstone Project:
      - Content: chapters/08-capstone-project/index.md
      - Quiz: chapters/08-capstone-project/quiz.md
  
  - Micro Simulations:
    - "Ranking Simulation": sims/ranking/index.md
    - "Harm Bubble Chart": sims/harm-bubble-chart/index.md
    - "Ethics Education Timeline": sims/ethics-education-timeline/index.md
    - "Graph Viewer": sims/graph-viewer/index.md
  
  - Learning Graph:
    - Introduction: learning-graph/index.md
    - Course Description Assessment: learning-graph/course-description-assessment.md
    - Concept List: learning-graph/concept-list.md
    - Concept Taxonomy: learning-graph/concept-taxonomy.md
    - Quality Metrics: learning-graph/quality-metrics.md
    - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
    - Glossary Quality Report: learning-graph/glossary-quality-report.md
    - FAQ Quality Report: learning-graph/faq-quality-report.md
    - Quiz Generation Report: learning-graph/quiz-generation-report.md
    - Book Metrics: learning-graph/book-metrics.md
    - Chapter Metrics: learning-graph/chapter-metrics.md
    - Diagram Table: learning-graph/diagram-table.md
    - Diagram Details: learning-graph/diagram-details.md
    - Build Notes: learning-graph/build-notes.md

  - Generative AI Prompts:
