    - Learning Graph:
      - Intro: prompts/learning-graph/index.md
      - prompts/learning-graph/01-course-description.md
      - prompts/learning-graph/02-concept-enumeration.md
      - prompts/learning-graph/03-concept-dependencies.md
    - Chapter Content Generation: prompts/chapter-content-generation.md
    - Bubble Chart: prompts/harm-bubble-chart.md
    - Glossary Prompt: prompts/glossary.md
    - OpenAI Feedback: outline.md

  - FAQ: faq.md
  - Glossary: glossary.md
  - References: references.md
  - License: license.md
  - Contact: contact.md
 
# CoderDojo Microsite Standards from here down

theme:
  name: material
  extra_css:
    - styles/custom.css
  logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    primary: 'blue'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - navigation.top
    # this adds the prev and next icons in the footer
    - navigation.footer
    - content.action.edit
plugins:
  - search
  - social
  - social_override
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.highlight:
      linenums: true
extra_css:
   - css/extra.css
